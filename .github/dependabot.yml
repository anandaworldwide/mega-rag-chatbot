# Dependabot configuration.
# - weekly cadence (security PRs still fire per-advisory, so daily scans
#   on top of that just duplicate noise)
# - groups all minor/patch/major updates so security majors don't spawn
#   solo PRs; enable "Grouped security updates" in repo Settings so the
#   security feed respects these groups too
# - single assignment source (reviewers only) to halve notifications
# - tight PR limits to cap the notification surface

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - "anandaworldwide/maintainers"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    # Block upgrades that we cannot adopt. Keep entries short and point to
    # security/accepted-vulns.yaml for the full justification.
    ignore:
      # optimum-onnx==0.1.0 pins transformers<4.58.0 (CVE-2026-1839 accepted).
      # Revisit when optimum-onnx releases a version compatible with transformers 5.x.
      - dependency-name: "transformers"
        update-types:
          - "version-update:semver-major"
    groups:
      python-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # Node.js dependencies (web directory)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    reviewers:
      - "anandaworldwide/maintainers"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      node-all:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
          - "major"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "1"
      time: "09:00"
    open-pull-requests-limit: 2
    reviewers:
      - "anandaworldwide/maintainers"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-all:
        patterns:
          - "*"
