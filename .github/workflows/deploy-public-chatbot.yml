name: Deploy Public Chatbot Plugin to Cloudways

# Pushes to main deploy the plugin to ananda.org. Pull requests into main only
# dry-run: their log and job summary list every file the merge would change on
# the server, and change nothing. Both run only when the plugin (or this file)
# changes, so merges that touch other parts of the monorepo don't deploy.
on:
  push:
    branches:
      - main
    paths:
      - 'wordpress/plugins/ananda-ai-chatbot/**'
      - '.github/workflows/deploy-public-chatbot.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'wordpress/plugins/ananda-ai-chatbot/**'
      - '.github/workflows/deploy-public-chatbot.yml'

# One deploy at a time, never cancelled half-way through an rsync. Pull request
# dry runs get their own group per PR, so a queued dry run can't replace a
# merge's deploy waiting its turn.
concurrency:
  group: deploy-public-chatbot-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Forces the runner to use Node 24

jobs:
  deploy:
    name: Deploy wordpress/plugins folder via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Shared deploy: ananda-ci's cloudways-deploy action (see its README).
      # It targets the app's real path, never the /home/master/applications
      # symlink that rsync 3.5+ on the server refuses to follow.
      - name: Deploy plugin folder
        uses: anandaworldwide/ananda-ci/.github/actions/cloudways-deploy@deploy-v1
        with:
          server: ananda-org
          app: aghzsnrmqf
          user: github-ananda-org
          ssh-key: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          src: ./wordpress/plugins/ananda-ai-chatbot/
          dest: public_html/wp-content/plugins/ananda-ai-chatbot/
          dry-run: ${{ github.event_name == 'pull_request' }}
