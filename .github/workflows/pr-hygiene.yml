name: PR Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  proof-section:
    name: Proof section
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Proof section
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check-proof-section.py

  blocked-files:
    name: Blocked files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check blocked files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO_ROOT: ${{ github.workspace }}
        run: python3 .github/scripts/check-blocked-files.py
