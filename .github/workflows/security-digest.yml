name: Security Digest

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-digest
  cancel-in-progress: false

jobs:
  digest:
    name: Weekly Security Digest
    runs-on: ubuntu-latest

    env:
      DIGEST_LABEL: security-status
      DIGEST_TITLE: "Dependency security status"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            web/package-lock.json
            web/package.json

      - name: Install Python dependencies
        run: uv sync --locked --package mega-rag-chatbot --package mega-rag-chatbot-crawler

      - name: Install Node dependencies (workspaces root)
        run: npm ci

      - name: Make helper scripts executable
        run: chmod +x bin/export-python-requirements.sh bin/cooldown_audit.py bin/security_digest.py

      - name: Export compatibility requirements
        run: ./bin/export-python-requirements.sh

      - name: Python audit (digest only)
        continue-on-error: true
        run: |
          uv run --locked python bin/cooldown_audit.py python \
            --requirements requirements.txt \
            --requirements reranking/requirements.txt \
            --requirements data_ingestion/crawler/requirements.txt \
            --requirements wordpress/analytics/requirements.txt \
            --fail-level high \
            --json-out .cache/cooldown-audit/python.json

      - name: Node audit (digest only, workspaces root)
        continue-on-error: true
        run: |
          uv run --locked python bin/cooldown_audit.py node \
            --audit-dir . \
            --fail-level high \
            --json-out .cache/cooldown-audit/node.json

      - name: Render digest markdown
        run: |
          python bin/security_digest.py \
            .cache/cooldown-audit/python.json \
            .cache/cooldown-audit/node.json \
            --out .cache/cooldown-audit/digest.md
          cat .cache/cooldown-audit/digest.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure digest label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$DIGEST_LABEL" \
            --description "Weekly dependency security digest" \
            --color "D93F0B" \
            --force

      - name: Upsert and pin digest issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list \
            --state open \
            --label "$DIGEST_LABEL" \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updating existing digest issue #$existing"
            gh issue edit "$existing" \
              --title "$DIGEST_TITLE" \
              --body-file .cache/cooldown-audit/digest.md
            issue_number="$existing"
          else
            echo "Creating new digest issue"
            url=$(gh issue create \
              --title "$DIGEST_TITLE" \
              --label "$DIGEST_LABEL" \
              --body-file .cache/cooldown-audit/digest.md)
            issue_number="${url##*/}"
          fi

          echo "Pinning issue #$issue_number (idempotent; tolerates 3-pin cap)"
          gh issue pin "$issue_number" || echo "Pin skipped (already pinned or at 3-issue cap)"

      - name: Upload digest artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-digest-${{ github.run_id }}
          path: .cache/cooldown-audit/*
          if-no-files-found: ignore
          retention-days: 90
