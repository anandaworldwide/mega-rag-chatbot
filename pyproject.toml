    "cohere>=5.0.0",
    "cryptography>=49.0.0,<50",
    "dill==0.4.0",
    "filelock>=3.20.1",
    "firebase-admin==7.1.0",
    "fpdf==1.7.2",
    "frozenlist==1.7.0",
    "fsspec==2024.6.1",
    "google-analytics-data",
    "google-api-core==2.25.2",
    "google-auth>=2.47.0",
    "google-cloud-firestore==2.21.0",
    "googleapis-common-protos==1.70.0",
    "grpcio==1.73.0",
    "grpcio-status==1.73.0",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==0.33.0",
    "langchain-core>=1.3.3",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.8.18",
    "matplotlib",
    "moviepy==1.0.3",
    "multidict==6.4.4",
    "multiprocess==0.70.18",
    "mutagen==1.47.0",
    "networkx==3.4.2",
    "nltk==3.9.4",
    "numpy>=2.0,<3.0",
    "openai>=2.20.0",
    "openpyxl==3.1.5",
    "orjson>=3.11.6",
    "pandas==2.3.0",
    "pdfminer-six>=20251230",
    "pdfplumber>=0.11.8",
    "pinecone>=8.0.0",
    "playwright>=1.55.1",
    "protobuf>=6.33.5",
    "psutil",
    "pyasn1>=0.6.3",
    "pycryptodomex==3.23.0",
    "pyjwt[crypto]>=2.12.0",
    "pygments>=2.20.0",
    "pymysql==1.1.1",
    "pydub==0.25.1",
    "python-dateutil==2.9.0.post0",
    "python-dotenv==1.2.2",
    "pytz==2024.1",
    "readability-lxml",
    "reportlab==4.2.5",
    "requests>=2.33.0",
    "rsa==4.9.1",
    "s3transfer==0.13.0",
    "scikit-learn",
    "seaborn",
    "spacy>=3.8.11",
    "tenacity==8.2.2",
    "tiktoken==0.12.0",
    "tokenizers==0.21.1",
    "tqdm==4.67.1",
    "transformers>=5.3.0",
    "typer==0.16.0",
    "typing_extensions==4.14.0",
    "urllib3>=2.7.0",
    "websockets==15.0.1",
    "yarl==1.20.1",
    "yt-dlp==2026.6.9",
]

[dependency-groups]
dev = [
    "pip-audit",
    "pipdeptree==2.26.1",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-mock",
    "ruff==0.11.13",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.11.3"
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["data_ingestion/crawler", "reranking", "wordpress/analytics"]

[tool.ruff]
# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11+
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`)  codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C90"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["data_ingestion", "pyutil"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "--tb=short"
] 