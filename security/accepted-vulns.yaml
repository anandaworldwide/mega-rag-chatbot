      pip-audit. Same adoption constraints as PYSEC-2026-3929 / CVE-2026-1839:
      optimum-onnx 0.1.0, huggingface-hub 0.33.0, and tokenizers==0.21.1
      block transformers 5.x. Reranking is dormant; no untrusted models
      are loaded.
