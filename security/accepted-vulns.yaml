      but 5.x adoption is blocked by optimum-onnx 0.1.0 (pins
      transformers<4.58.0), huggingface-hub 0.33.0 (transformers 5.x needs
      >=1.5), and tokenizers==0.21.1 (transformers 5.x needs >=0.22).
      Reranking is dormant; no untrusted models are loaded.
    review_by: "2027-01-05"
    mitigation: "Dormant reranking subgraph; no user-controlled model loading."

