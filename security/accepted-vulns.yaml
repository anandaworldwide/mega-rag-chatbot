    mitigation: "Dormant reranking subgraph; not reachable in production."

  - id: PYSEC-2026-3740
    package: nltk
    reason: >-
      pathsec sandbox bypass on model load/save (GHSA-8mgp-746c-j5xp /
      CVE-2026-81726). No patched PyPI release; nltk 3.10.3 is latest.
      We do not use pathsec enforcement or untrusted model paths. Ingestion
      and evaluation load trusted local corpora only.
    review_by: "2027-01-05"
    mitigation: "No pathsec enforcement; trusted local NLTK data only."

node:
  - id: "1117038"
    package: showdown
    reason: >-
      No fixed npm release (latest 2.1.0 is within advisory range). Used only in
      CopyButton to convert trusted app-generated markdown to HTML for clipboard
      export, not for rendering untrusted user HTML.
    review_by: "2026-11-01"
    mitigation: >-
      Input is chat answer markdown from our pipeline; ReDoS in link/anchor
      parsing is low practical risk. Revisit if showdown ships a patch or we
      replace the converter.

  - id: "1138814"
    package: showdown
    reason: >-
      No fixed npm release (latest 2.1.0 is within advisory range). Same trusted
      clipboard-only usage as 1117038: CopyButton converts app-generated markdown
      to HTML for export, not for rendering untrusted user HTML.
    review_by: "2026-11-01"
    mitigation: >-
      Metadata-title XSS in showdown is not reachable for clipboard export of
      trusted chat answers. Revisit if showdown ships a patch or we replace the
      converter.

  - id: "1138815"
