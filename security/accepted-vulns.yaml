      block the upgrade. Reranking is dormant; the only import is offline
      evaluate_rerankers.py with hardcoded trusted model sources and no
      Trainer, pipeline, or user-controlled from_pretrained paths.
    review_by: "2027-01-05"
    mitigation: "Dormant reranking subgraph; not reachable in production."

