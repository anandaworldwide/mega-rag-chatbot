# Accepted / policy-exempt vulnerabilities.
#
# Only put entries here that fall into one of these two buckets:
#   1. No fixed release exists upstream (we cannot patch).
#   2. A fixed release exists but cannot be adopted due to a hard project
#      constraint (pinned transitive, major version incompatibility, etc.)
#
# Do NOT add entries for "a fix exists but it's <7 days old". The audit script
# auto-detects those via registry publish dates and treats them as
# informational during the cooldown window. Manually ignoring them here would
# mask the alert once the fix ages past cooldown.
#
# Schema:
#   id:         vulnerability identifier (CVE-*, GHSA-*, PYSEC-*, or npm advisory id)
#   package:    affected package name
#   reason:     human explanation (required)
#   review_by:  ISO date for forced re-review; the script fails if today >= review_by
#   mitigation: optional operational mitigation note

python:
  - id: CVE-2025-3000
    package: torch
    reason: >-
      No fixed PyPI release reported by pip-audit. Reranking tooling is dormant
      experimental code and does not load untrusted models or arbitrary
      checkpoints from users.
    review_by: "2026-10-07"
    mitigation: "Dormant reranking subgraph; not deployed on Vercel or crawler Docker."

  - id: CVE-2026-28500
    package: onnx
    reason: >-
      No fixed PyPI release. Reranking tooling is dormant experimental code and
      does not load untrusted models via onnx.hub.load().
    review_by: "2026-10-07"
    mitigation: "Dormant reranking subgraph; not deployed on Vercel or crawler Docker."

  - id: CVE-2026-1839
    package: transformers
    reason: >-
      Fix is in transformers 5.x, but adoption is blocked by tokenizers==0.21.1
      (transformers 5.3+ requires tokenizers>=0.22) and optimum-onnx 0.1.0
      (pins transformers<4.58.0). Reranking is dormant: only
      reranking/evaluate_rerankers.py imports transformers (offline eval with
      hardcoded trusted HF model); not deployed on Vercel or crawler Docker.
      Requires coordinated transformers/tokenizers/optimum-onnx upgrade if
      reranking is revived.
    review_by: "2026-10-07"
    mitigation: "Dormant reranking subgraph; no user-controlled model loading."

  - id: CVE-2026-4372
    package: transformers
    reason: >-
      Remote code execution; fix is in transformers>=5.3.0. Same adoption
      constraints as CVE-2026-1839: tokenizers==0.21.1 and optimum-onnx 0.1.0
      block the upgrade. Reranking is dormant; the only import is offline
      evaluate_rerankers.py with hardcoded trusted model sources and no
      Trainer, pipeline, or user-controlled from_pretrained paths.
    review_by: "2026-10-07"
    mitigation: "Dormant reranking subgraph; not reachable in production."

